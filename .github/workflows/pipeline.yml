name: Test, Build, and Publish

on:
  push:
    branches:
      - main

jobs:
  test-build-and-push:
    runs-on: self-hosted-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Go is baked into the self-hosted runner image (/usr/local/go). setup-go
      # with any other version downloads a toolchain at job time; go.mod's
      # `go 1.23.0` / `toolchain go1.23.5` are satisfied by the newer baked Go
      # (taskforge-2675). Fail loudly if it is ever absent.
      - name: Verify baked Go
        run: go version

      - name: Run tests
        run: |
          go test -v ./...
          go test -cover ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build and push
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --build-arg VERSION=v${{ github.run_number }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --cache-from=type=registry,ref=supporttools/reflow-ingress-logs:latest \
            --cache-to=type=inline \
            -t supporttools/reflow-ingress-logs:v${{ github.run_number }} \
            -t supporttools/reflow-ingress-logs:latest \
            --push \
            -f Dockerfile .

      - name: Verify image in DockerHub
        run: |
          echo "Verify the image has been pushed successfully."
          docker pull supporttools/reflow-ingress-logs:latest
          docker images | grep supporttools/reflow-ingress-logs

  publish-helm-chart:
    runs-on: self-hosted-linux
    needs: test-build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Helm is baked into the self-hosted runner image; no installer action
      # (no job-time downloads, taskforge-2675). Fail loudly if it ever is not.
      - name: Verify baked Helm
        run: helm version --short

      - name: Helm Lint
        run: helm lint charts/reflow-ingress-logs/

      - name: Package Helm chart
        run: |
          export CHART_VERSION="v${{ github.run_number }}"
          export APP_VERSION="v${{ github.run_number }}"
          export IMAGE_TAG="v${{ github.run_number }}"
          echo "CHART_VERSION=${CHART_VERSION}"
          echo "APP_VERSION=${APP_VERSION}"
          envsubst < charts/reflow-ingress-logs/Chart.yaml.template > charts/reflow-ingress-logs/Chart.yaml
          envsubst < charts/reflow-ingress-logs/values.yaml.template > charts/reflow-ingress-logs/values.yaml
          helm package charts/reflow-ingress-logs --destination helm/repo

      - name: Mint helm-chart repo token (GitHub App supporttools-chart-publisher)
        id: chart-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHART_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHART_APP_PRIVATE_KEY }}
          owner: SupportTools
          repositories: helm-chart,helm-chart-private

      - name: Checkout helm-chart repository
        uses: actions/checkout@v2
        with:
          repository: supporttools/helm-chart
          path: helm-chart
          token: ${{ steps.chart-app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.email "github-action@users.noreply.github.com"
          git config --global user.name "GitHub Action"

      - name: Update Helm repository
        run: |
          cp helm/repo/reflow-ingress-logs-*.tgz helm-chart/
          cd helm-chart
          helm repo index . --url https://charts.support.tools/
          git add .
          git commit -m "Update Helm chart for reflow-ingress-logs"
          git push
